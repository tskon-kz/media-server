services:
  jellyfin:
    # Pinned to a known-good version. Was :latest — an uncontrolled major upgrade
    # (10.x) once broke the stack on a routine update. Bump deliberately.
    # 12.0 migrates the DB irreversibly: update.sh backs up data/jellyfin first
    # and triggers the full library scan the release notes require.
    image: jellyfin/jellyfin:12.0@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
    container_name: media-server-jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_PATH:-./media}:/media
  qbittorrent:
    # qBittorrent 5.2.3 (hotio). Pinned by digest — qB 5.x renamed torrent states
    # (paused* -> stopped*), so an unplanned bump can break status/done detection.
    image: ghcr.io/hotio/qbittorrent@sha256:d42ffc026b8c317803ce2ac9611c093dec4ab414f463378ce1b81704a0e0fd22
    container_name: media-server-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBUI_PORTS=${QB_PORT:-8080}/tcp
    ports:
      - "${QB_PORT:-8080}:${QB_PORT:-8080}"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent/config:/config
      - ${MEDIA_PATH:-./media}:/media

  jackett:
    # Jackett v0.24.2558-ls25. Pinned by digest — bump deliberately.
    image: linuxserver/jackett@sha256:eadcc99cc5b9ec57f728b9d3146c7539f006a174c1e3d3f41ab42de5dae0c5e6
    container_name: media-server-jackett
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    ports:
      - "${JACKETT_PORT:-9117}:9117"
    volumes:
      - ./data/jackett/config:/config

  # Solves Cloudflare challenges for indexers that need them (e.g. RuTracker).
  # Internal only — Jackett reaches it at http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: media-server-flaresolverr
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - LOG_LEVEL=info

  telegram-bot:
    image: ghcr.io/tskon-kz/media-server-bot:${BOT_IMAGE_TAG:-stable}
    container_name: media-server-telegram-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER=${ALLOWED_USER}
      - QB_HOST=http://qbittorrent:${QB_PORT:-8080}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PORT=${JELLYFIN_PORT:-8096}
      - QB_PORT=${QB_PORT:-8080}
      - JACKETT_URL=${JACKETT_URL:-http://jackett:9117}
      - JACKETT_PORT=${JACKETT_PORT:-9117}
      - WATCHTOWER_TOKEN=${WATCHTOWER_TOKEN}
      - WEBAPP_URL=${WEBAPP_DOMAIN:+https://}${WEBAPP_DOMAIN}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bot-data:/app/data
      - ${MEDIA_PATH:-./media}:/media
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/jackett/config:/jackett-config
    depends_on:
      - qbittorrent
      - jellyfin
      - jackett
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  upscaler:
    # Video upscaler worker: polls the shared SQLite queue and rewrites files in
    # place with a single ffmpeg pass. Both backends run on the GPU via libplacebo
    # (Vulkan) and need a /dev/dri device: `anime4k` runs the Anime4K neural
    # shaders (anime), `fsr` a high-quality anti-ring scaler (films). /dev/dri
    # covers AMD/Intel iGPUs; NVIDIA users add a runtime override in
    # docker-compose.override.yml. Built locally, not pulled.
    build:
      context: .
      dockerfile: upscaler/Dockerfile
    container_name: media-server-upscaler
    restart: unless-stopped
    volumes:
      - ./bot-data:/app/data                 # shared SQLite job queue
      - ${MEDIA_PATH:-./media}:/media        # same media paths as the other services
    devices:
      # Vulkan (AMD/Intel iGPU) — required: both backends are GPU-only now.
      - /dev/dri:/dev/dri
    depends_on:
      - telegram-bot

  cloudflared:
    # Pinned by digest — bump deliberately.
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: media-server-cloudflared
    restart: unless-stopped
    # Default quick tunnel. Profile derives from WEBAPP_DOMAIN: unset -> "" (on),
    # set -> "disabled" (off) — so a domain in .env alone switches this off.
    profiles: [ "${WEBAPP_DOMAIN:+disabled}" ]
    command: tunnel --no-autoupdate --protocol http2 --url http://telegram-bot:8081
    depends_on:
      - telegram-bot

  caddy:
    # Own-domain mode (no Cloudflare): auto-HTTPS reverse proxy to the bot. Runs
    # only when the `own-domain` profile is active (WEBAPP_DOMAIN set). Needs DNS
    # for WEBAPP_DOMAIN on this host and ports 80/443 open. Pinned by digest.
    # Uses a Caddyfile (not the reverse-proxy one-liner) so the upstream is a
    # `dynamic a` source that re-resolves telegram-bot's IP — otherwise Caddy
    # stays pinned to the pre-update container and 502s after a bot self-update.
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: media-server-caddy
    restart: unless-stopped
    profiles: [ "own-domain" ]
    environment:
      - CADDY_SITE=${WEBAPP_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./data/caddy:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - telegram-bot

  caddy-proxy:
    # Behind-proxy mode: the host already runs its own reverse proxy (nginx, …)
    # for other sites, so Caddy can't take 80/443. Instead it serves the Mini App
    # as PLAIN HTTP on a loopback host port (WEBAPP_PROXY_PORT) for that external
    # proxy to forward to (which terminates TLS). Same dynamic-upstream Caddyfile
    # as own-domain — only CADDY_SITE differs (`:8081` -> no ACME). As a separate,
    # never-swapped container it keeps the loopback port stable across the bot's
    # blue/green self-update, so the bot port itself stays internal. Bound to
    # 127.0.0.1 so it's reachable only via the host's proxy, never the public NIC.
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: media-server-webapp-proxy
    restart: unless-stopped
    profiles: [ "behind-proxy" ]
    environment:
      - CADDY_SITE=:8081
    ports:
      - "127.0.0.1:${WEBAPP_PROXY_PORT:-18081}:8081"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - telegram-bot

  watchtower:
    # Pinned by digest — bump deliberately.
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: media-server-watchtower
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WATCHTOWER_PORT:-9080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.41
    command: --http-api-update --label-enable --interval 604800
